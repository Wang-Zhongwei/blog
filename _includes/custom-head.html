<!-- KaTeX -----------------------------------------------------------------------
     Math is pre-rendered to HTML + MathML at build time by scripts/render-math.js,
     so no JavaScript runs for math and there is no flash of raw TeX to hide.
     Only the stylesheet is needed, to lay the pre-rendered spans out.

     CSS and fonts are vendored from the same KaTeX version that renders the
     markup (see package.json), so the stylesheet cannot drift out of sync with
     the HTML the way a separately-pinned CDN link can -- and there is no
     third-party request on the critical path. woff2 only: every browser that
     can render this markup supports woff2, and shipping woff/ttf as well would
     triple the font payload.
-->
<link rel="stylesheet" href="{{ '/assets/katex/katex.css' | relative_url }}">
