title: "Near Criticality"   # pick your own blog title
description: "Notes by Zhongwei Wang on RL, AI, physics and complex systems"
author: "Zhongwei Wang"
lang: en

# Used by the JSON-LD block in _layouts/default.html. Search engines use these
# to tie the site to a person; drop any line you do not want emitted.
author_url: "https://github.com/Wang-Zhongwei"

# Layouts, styles and the light/dark toggle live in this repo (_layouts/,
# assets/css/main.css) — no external theme gem, so nothing to keep in sync
# with whatever version GitHub Pages happens to ship.

# If you publish as a *project* page (github.com/<user>/blog), set:
#   baseurl: "/blog"
# If you publish as <user>.github.io, leave baseurl empty.
baseurl: "/blog"
url: "https://wang-zhongwei.github.io"

# GoatCounter analytics. Set this to your site code — the subdomain you chose at
# goatcounter.com, i.e. just "nearcriticality" for nearcriticality.goatcounter.com.
# Leaving it empty disables the snippet entirely, so local builds stay clean.
# GoatCounter's count.js already ignores localhost and private IPs, so there is
# nothing extra to guard during development.
goatcounter_code: "nearcriticality"

markdown: kramdown
kramdown:
  # Left as `mathjax` deliberately: kramdown emits math as literal \[ ... \] and
  # \( ... \) delimiters, which scripts/render-math.js then pre-renders to real
  # HTML + MathML with KaTeX after the Jekyll build. Keeping the Ruby side stock
  # means this config still builds identically under Pages' own builder.
  math_engine: mathjax
  syntax_highlighter: rouge

excerpt_separator: "\n\n"

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - linkedin-teaser.md
  - preview.sh
  - Gemfile
  - Gemfile.lock
  - experiments
